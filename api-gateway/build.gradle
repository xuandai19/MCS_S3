plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', '2023.0.0')
	set('nettyVersion', '4.1.120.Final')
	set('lombokVersion', '1.18.38')
}

dependencies {
	// Spring Cloud Gateway
	implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// Lombok - version mới để tương thích JDK 21+
	compileOnly "org.projectlombok:lombok:${lombokVersion}"
	annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
	dependencies {
		// Chỉ ghi đè Netty modules sử dụng Unsafe
		dependency "io.netty:netty-common:${nettyVersion}"
		dependency "io.netty:netty-buffer:${nettyVersion}"
	}
}

// Loại trừ spring-boot-starter-web nếu bị kéo vào gián tiếp
configurations {
	all {
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-web'
	}
}

// JVM Arguments
tasks.named('bootRun') {
	jvmArgs = [
			'--sun-misc-unsafe-memory-access=allow',
			'-Dio.netty.tryReflectionSetAccessible=true'
	]
}

tasks.named('test') {
	useJUnitPlatform()
}